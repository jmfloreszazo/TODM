name: TODM minimal research seed
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  synthetic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute synthetic oracle and governance negative controls
        run: python3 -m unittest discover -s tests -v
      - name: Demonstrate fail-closed release
        run: python3 src/todm_demo.py
