name: TODM v1.4 cross-language CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: todm-seed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python oracle and governance controls
        run: python3 -m unittest discover -s tests -v
      - name: Demonstrate fail-closed release
        run: python3 src/todm_demo.py
      - name: Validate all 16 Python policy fixtures
        run: python3 scripts/check_parity.py
  dotnet10-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build .NET 10
        run: dotnet build dotnet/Todm.Seed/Todm.Seed.csproj -c Release -warnaserror
      - name: Run synthetic acceptance and governance assertions
        run: dotnet run --project dotnet/Todm.Seed/Todm.Seed.csproj -c Release --no-build -- --self-test
      - name: Demonstrate .NET fail-closed release
        run: dotnet run --project dotnet/Todm.Seed/Todm.Seed.csproj -c Release --no-build
      - name: Assert Python/.NET verdict parity across 16 fixtures
        run: python3 scripts/check_parity.py --dotnet
