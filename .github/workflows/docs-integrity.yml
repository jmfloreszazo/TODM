name: TODM documentation and paper integrity
on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/docs-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/docs-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository-local Markdown links
        run: python3 scripts/check_markdown_links.py
      - name: Verify 88 frozen research source files
        run: python3 scripts/verify_artifact_manifest.py
      - name: Verify tracked manuscript and PDF are present
        run: |
          test -s paper/source/main.tex
          test -s paper/source/references.bib
          test -s paper/TODM_Paper_v1.2.pdf
          test -s paper/TODM_Paper_v1.2.md
