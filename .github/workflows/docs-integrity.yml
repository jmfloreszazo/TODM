name: TODM v1.4 documentation and integrity
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'VERSION'
      - 'CITATION.cff'
      - 'docs/ARTIFACT_MANIFEST.json'
      - 'scripts/check_markdown_links.py'
      - 'scripts/check_version_alignment.py'
      - 'paper/source/main.tex'
      - 'paper/TODM_Paper_v1.4.pdf'
      - '.github/workflows/docs-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'VERSION'
      - 'CITATION.cff'
      - 'docs/ARTIFACT_MANIFEST.json'
      - 'scripts/check_markdown_links.py'
      - 'scripts/check_version_alignment.py'
      - 'paper/source/main.tex'
      - '.github/workflows/docs-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: todm-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local Markdown links
        run: python3 scripts/check_markdown_links.py
      - name: Verify 85 immutable historical research sources
        run: python3 scripts/verify_artifact_manifest.py
      - name: Verify v1.4 paper, demo, workflow and citation alignment
        run: python3 scripts/check_version_alignment.py --allow-uncompiled-pdf
