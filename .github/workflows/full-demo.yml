name: TODM v1.4 full research artifact
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'docs/ARTIFACT_MANIFEST.json'
      - '.github/workflows/full-demo.yml'
  pull_request:
    paths:
      - 'demo/**'
      - 'docs/ARTIFACT_MANIFEST.json'
      - '.github/workflows/full-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: todm-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full artifact source integrity (85 SHA-256 hashes)
        run: python3 ../scripts/verify_artifact_manifest.py
      - name: Run all Python reference, signature and negative controls
        run: python3 scripts/reproduce.py
      - name: Verify signed G2/G6 checks
        run: python3 scripts/verify_signed.py
      - uses: actions/upload-artifact@v4
        with:
          name: todm-v1.5-python-evidence
          path: |
            demo/results/reference-execution.json
            demo/results/governance-execution.json
            demo/results/signed-assurance-execution.json
            demo/results/reproducibility-v1.5.json
          if-no-files-found: error
  dotnet10-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run full C# engine and all 16 governance fixtures
        run: bash scripts/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: todm-v1.5-dotnet-evidence
          path: |
            demo/results/governance-dotnet.json
            demo/results/governance-execution.json
            demo/results/reports/*.json
          if-no-files-found: error
