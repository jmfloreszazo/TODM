name: Build TODM v1.5 research paper PDF
on:
  push:
    branches: [main, 'refactor/v1.5.0']
    paths:
      - 'paper/source/**'
      - 'paper/TODM_Paper_v1.5.md'
      - '.github/workflows/paper-pdf.yml'
  pull_request:
    paths:
      - 'paper/source/**'
      - 'paper/TODM_Paper_v1.5.md'
      - '.github/workflows/paper-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: todm-paper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX, fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern latexmk poppler-utils zip
      - name: Compile canonical v1.5 manuscript
        run: |
          cd paper/source
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error v1.5.tex
          test -s v1.5.pdf
          cp v1.5.pdf ../TODM_Paper_v1.5.pdf
          pdfinfo ../TODM_Paper_v1.5.pdf | grep -E '^(Title|Pages|Page size):'
          pdftotext ../TODM_Paper_v1.5.pdf - | grep -F 'v1.5'
          sha256sum ../TODM_Paper_v1.5.pdf
      - name: Package canonical v1.5 arXiv source
        run: |
          cd paper/source
          zip -9 -q ../TODM_arXiv_source_v1.5.zip v1.5.tex references.bib figures/todm_method.pdf figures/todm_planes.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: TODM-v1.5-Paper-PDF-and-arXiv-Source
          path: |
            paper/TODM_Paper_v1.5.pdf
            paper/TODM_arXiv_source_v1.5.zip
          if-no-files-found: error
      # PDF output is a workflow artifact only. Never push generated files to main.
