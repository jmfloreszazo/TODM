name: Verify and publish TODM v1.5 research release
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type PUBLISH_V1_5_EXPLICITLY to authorize a release workflow run'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: todm-v1.5-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release == 'PUBLISH_V1_5_EXPLICITLY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify version, links and frozen source hashes
        run: |
          python3 scripts/check_markdown_links.py
          python3 scripts/verify_artifact_manifest.py
          python3 scripts/check_version_alignment.py --allow-uncompiled-pdf
      - name: Compile and verify canonical v1.5 PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern latexmk poppler-utils zip
          cd paper/source
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error v1.5.tex
          cp v1.5.pdf ../TODM_Paper_v1.5.pdf
      - name: Verify compiled v1.5 PDF matches manuscript
        run: |
          test -s paper/TODM_Paper_v1.5.pdf
          pdfinfo paper/TODM_Paper_v1.5.pdf | grep -E '^Pages:'
          pdftotext paper/TODM_Paper_v1.5.pdf - | grep -F 'v1.5'
      - name: Reproduce full Python research artifact
        run: cd demo && python3 scripts/reproduce.py
      - name: Verify full .NET 10 governance fixtures and five oracle families
        run: cd demo && bash scripts/run.sh
      - name: Assemble canonical v1.5 release archives
        run: |
          mkdir -p release
          cd paper/source
          zip -9 -q ../../release/TODM_arXiv_source_v1.5.zip v1.5.tex references.bib figures/todm_method.pdf figures/todm_planes.pdf
          cd ../..
          zip -9 -q -r release/TODM_Research_Artifact_v1.5.0.zip \
            paper demo docs scripts research-models dotnet contracts tests \
            README.md VERSION LICENSE CITATION.cff .github/workflows \
            -x '*/__pycache__/*' '*.pyc'
          test -s release/TODM_arXiv_source_v1.5.zip
          test -s release/TODM_Research_Artifact_v1.5.0.zip
          sha256sum paper/TODM_Paper_v1.5.pdf release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TODM-v1.5-Verified-Research-Release
          path: |
            paper/TODM_Paper_v1.5.pdf
            release/*.zip
          if-no-files-found: error
      - name: Publish immutable tagged release only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view todm-research-v1.5.0 >/dev/null 2>&1; then
            echo 'Immutable v1.5.0 research release already exists; refusing to overwrite it.'
          else
            gh release create todm-research-v1.5.0 \
              paper/TODM_Paper_v1.5.pdf \
              release/TODM_arXiv_source_v1.5.zip \
              release/TODM_Research_Artifact_v1.5.0.zip \
              --target "$(git rev-parse HEAD)" \
              --title 'TODM v1.5.0 — Unified Paper, Demo and Verified Research Artifact' \
              --notes 'Unified methodology, v1.5 manuscript, reproducible synthetic Python/.NET 10 five-oracle-family demonstration, 16 governance fixtures, independently checked documentation and SHA-256 provenance. Historical v0.4 fixture format retained as research provenance. No DOI, arXiv acceptance, industrial comparative superiority or production IAM claims.'
          fi
