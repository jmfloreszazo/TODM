name: Verify and publish TODM v1.4 research release
on:
  workflow_run:
    workflows:
      - Build TODM v1.4 research paper PDF
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: todm-v1.4-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify version, links and frozen source hashes
        run: |
          python3 scripts/check_markdown_links.py
          python3 scripts/verify_artifact_manifest.py
          python3 scripts/check_version_alignment.py
      - name: Verify compiled v1.4 PDF matches manuscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          test -s paper/TODM_Paper_v1.4.pdf
          pdfinfo paper/TODM_Paper_v1.4.pdf | grep -E '^Pages:'
          pdftotext paper/TODM_Paper_v1.4.pdf - | grep -F 'v1.4'
      - name: Reproduce full Python research artifact
        run: cd demo && python3 scripts/reproduce.py
      - name: Verify full .NET 10 governance fixtures and five oracle families
        run: cd demo && bash scripts/run.sh
      - name: Assemble canonical v1.4 release archives
        run: |
          mkdir -p release
          cd paper/source
          zip -9 -q ../../release/TODM_arXiv_source_v1.4.zip main.tex references.bib main.bbl figures/todm_method.pdf figures/todm_planes.pdf
          cd ../..
          zip -9 -q -r release/TODM_Research_Artifact_v1.4.0.zip \
            paper demo docs scripts research-models dotnet contracts tests \
            README.md VERSION LICENSE CITATION.cff .github/workflows \
            -x '*/__pycache__/*' '*.pyc'
          test -s release/TODM_arXiv_source_v1.4.zip
          test -s release/TODM_Research_Artifact_v1.4.0.zip
          sha256sum paper/TODM_Paper_v1.4.pdf release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TODM-v1.4-Verified-Research-Release
          path: |
            paper/TODM_Paper_v1.4.pdf
            release/*.zip
          if-no-files-found: error
      - name: Publish immutable tagged release only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view todm-research-v1.4.0 >/dev/null 2>&1; then
            echo 'Immutable v1.4.0 research release already exists; refusing to overwrite it.'
          else
            gh release create todm-research-v1.4.0 \
              paper/TODM_Paper_v1.4.pdf \
              release/TODM_arXiv_source_v1.4.zip \
              release/TODM_Research_Artifact_v1.4.0.zip \
              --target "$(git rev-parse HEAD)" \
              --title 'TODM v1.4.0 — Unified Paper, Demo and Verified Research Artifact' \
              --notes 'Unified methodology, 20-page manuscript v1.4, reproducible synthetic Python/.NET 10 five-oracle-family demonstration, 16 governance fixtures, independently checked documentation and SHA-256 provenance. Historical v0.4 fixture format retained as research provenance. No DOI, arXiv acceptance, industrial comparative superiority or production IAM claims.'
          fi
