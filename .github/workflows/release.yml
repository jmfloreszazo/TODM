name: Verify and publish TODM research release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify 88 source hashes
        run: python3 scripts/verify_artifact_manifest.py
      - name: Reproduce full Python research artifact
        run: cd demo && python3 scripts/reproduce.py
      - name: Verify all full .NET 10 governance fixtures and five oracle families
        run: cd demo && bash scripts/run.sh
      - name: Verify compiled 20-page PDF exists in repository
        run: |
          test -s paper/TODM_Paper_v1.2.pdf
          file paper/TODM_Paper_v1.2.pdf | grep PDF
      - name: Assemble downloadable reproducibility archives
        run: |
          mkdir -p release
          cd paper/source
          zip -9 -q ../../release/TODM_arXiv_source_v1.2.zip main.tex references.bib main.bbl figures/todm_method.pdf figures/todm_planes.pdf
          cd ../..
          zip -9 -q -r release/TODM_Research_Artifact_v1.2.zip \
            paper demo docs scripts research-models dotnet contracts tests \
            README.md LICENSE CITATION.cff .github/workflows \
            -x '*/__pycache__/*' '*.pyc'
          test -s release/TODM_arXiv_source_v1.2.zip
          test -s release/TODM_Research_Artifact_v1.2.zip
          sha256sum paper/TODM_Paper_v1.2.pdf release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TODM-Verified-Release-Assets
          path: |
            paper/TODM_Paper_v1.2.pdf
            release/*.zip
          if-no-files-found: error
      - name: Publish immutable tagged research release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view todm-research-v1.2 >/dev/null 2>&1; then
            echo 'Research release already exists; refusing to overwrite immutable assets.'
          else
            gh release create todm-research-v1.2 \
              paper/TODM_Paper_v1.2.pdf \
              release/TODM_arXiv_source_v1.2.zip \
              release/TODM_Research_Artifact_v1.2.zip \
              --target "$GITHUB_SHA" \
              --title 'TODM Research Artifact v1.2 — Paper and Full Demo' \
              --notes 'Full 20-page research manuscript, arXiv LaTeX source candidate, and reproducible Python/.NET 10 five-family synthetic demo with 16 governance fixtures. GitHub Actions verifies source integrity and cross-language parity. Methodological research proposal; no industrial comparative effectiveness, production identity assurance, DOI, or arXiv acceptance is claimed.'
          fi

# The release is gated on the corrected 88-file SHA-256 provenance manifest.
